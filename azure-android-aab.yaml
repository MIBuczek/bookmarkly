trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: $(npm_config_cache)
    displayName: 'Cache npm packages'

  - script: npm ci
    displayName: 'Install dependencies'

  # Set up Java - Required for Android builds
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
    displayName: 'Install Java 17'

  # Generate native folders on the fly
  - script: npx expo prebuild --platform android --non-interactive
    displayName: 'Expo Prebuild (Android)'

  # Build Android (Generating a release APK)
  # Note: This assumes you have the 'android' folder from 'npx expo prebuild'
  - script: |
      cd android
      chmod +x gradlew
      ./gradlew assembleRelease
    displayName: 'Build Android Release APK'

  # Find the generated APK and move it to the artifacts directory
  - task: CopyFiles@2
    inputs:
      Contents: 'android/app/build/outputs/apk/release/*.apk'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      flattenFolders: true
    displayName: 'Copy APK to Staging'

  # Upload the APK to Azure Pipeline Artifacts (Artifactory)
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'android-production-build'
    displayName: 'Upload APK to Artifactory'
